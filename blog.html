		<script>
			(function(){
				var audio = document.getElementById('bgAudio');
				var playBtn = document.getElementById('playAudioBtn');
				var unmuteBtn = document.getElementById('unmuteAudioBtn');
				function tryPlay(withMute){
					audio.muted = !!withMute;
					audio.play().then(function(){
						if(withMute) unmuteBtn.style.display = 'inline-block'; else unmuteBtn.style.display = 'none';
					}).catch(function(){
						if(!withMute){
							// try muted play if unmuted blocked
							tryPlay(true);
						}
						unmuteBtn.style.display = 'inline-block';
					});
				}
				// attempt autoplay unmuted first
				tryPlay(false);
				playBtn.addEventListener('click', function(){ tryPlay(false); });
				unmuteBtn.addEventListener('click', function(){ audio.muted = false; audio.play(); unmuteBtn.style.display='none'; });
			})();
		</script>
